[package]
name = "filmcraft-engine"
description = "FilmCraft engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["filmcraft-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["filmcraft-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["filmcraft-tts/kokoro", "speech-download"]

[dependencies]
filmcraft-time = { workspace = true }
filmcraft-geom = { workspace = true }
filmcraft-color = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-codecs = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-edit = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-scopes = { workspace = true }
filmcraft-text = { workspace = true }
filmcraft-audio-dsp = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-mxf = { workspace = true }
filmcraft-format = { workspace = true }
filmcraft-interchange = { workspace = true }
filmcraft-captions = { workspace = true }
filmcraft-speech = { workspace = true }
filmcraft-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "=0.10.9"
thiserror = { workspace = true }
log = { workspace = true }
craft-docpath = { workspace = true }
web-time = "1"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# sha2 0.10's ARM SHA-256 hardware backend is gated by this official feature.
# Runtime CPU detection retains its software fallback; complete-file proof is unchanged.
sha2 = { version = "=0.10.9", features = ["asm"] }

[target.'cfg(unix)'.dependencies]
# Constants only, through safe std OpenOptions: do not follow a redirected
# original leaf or block opening a FIFO substituted after metadata observation.
libc = "=0.2.189"

[dev-dependencies]
filmcraft-testkit = { workspace = true }
filmcraft-dng = { workspace = true, features = ["writer"] }
filmcraft-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }

# Same original fixture body; a distinct artifact keeps prior diagnostic binaries intact.
[[example]]
name = "agent_save_recovery_fixture"
path = "examples/agent_inspection_fixture.rs"
