[package]
name = "filmcraft-format"
description = "FilmCraft .fcproj files: schema versions + migrations, atomic saves, auto-save naming and rotation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmcraft-project = { workspace = true }
filmcraft-media = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = "=0.10.9"

[target.'cfg(any(target_vendor = "apple", target_os = "linux"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
filmcraft-time = { workspace = true }
